<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DairyCraft 2.5D</title>
  <!-- Carga de Phaser 4 vía CDN: no se instala por npm y queda fuera del build -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; background: #0b1218;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; overflow: hidden; touch-action: none;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    #game-container { width: 960px; height: 540px; max-width: 100vw; max-height: 100vh; }
    #game-container canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
